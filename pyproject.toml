[project]
name = "musicload"
version = "0.24.0"
description = "Search and download music from YouTube Music with lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.8.4.234419.dev0",
    "ytmusicapi>=1.8.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "uvicorn>=0.34.0",
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "mutagen>=1.47.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
musicload = "musicload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
