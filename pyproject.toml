[project]
name = "musicload"
version = "0.25.0"
description = "Search and download music from YouTube Music with lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.10.10.233141.dev0",
    "ytmusicapi>=1.12.3",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "typer>=0.27.3",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
musicload = "musicload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
