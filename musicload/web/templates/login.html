{% set asset_version = "ui-20261117-4" %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sign in · Musicload</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v={{ asset_version }}" />
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}" />
    <link rel="stylesheet" href="/static/design.css?v={{ asset_version }}" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <img class="login-logo" src="/static/musicload-mark.svg" alt="" />
      <h1>Sign in to Musicload</h1>
      <p class="login-provider">
        Use your
        <span><img src="/static/navidrome-logo.png" alt="" />Navidrome</span>
        account.
      </p>
      <form id="login-form" class="login-form">
        <label>
          Username
          <input id="login-username" name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          Password
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <div id="login-error" class="login-error" role="alert"></div>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script src="/static/login.js" defer></script>
  </body>
</html>
